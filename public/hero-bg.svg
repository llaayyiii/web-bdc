<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
  <defs>
    <pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.6" fill="#C6CEDA"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.35"/>
      <stop offset="0.55" stop-color="#FFFFFF" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="1"/>
    </linearGradient>
    <mask id="fadeMask">
      <rect width="1920" height="1080" fill="url(#fade)"/>
    </mask>
    <radialGradient id="glowBlue">
      <stop offset="0" stop-color="#095BAF" stop-opacity="0.13"/>
      <stop offset="1" stop-color="#095BAF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowYellow">
      <stop offset="0" stop-color="#EEDD55" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#EEDD55" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- Latar + tekstur dot grid (lebih terang ke kiri, jelas ke kanan) -->
  <rect width="1920" height="1080" fill="#EFF0F0"/>
  <rect width="1920" height="1080" fill="url(#dots)" mask="url(#fadeMask)"/>

  <!-- Glow lembut -->
  <ellipse cx="1650" cy="150" rx="430" ry="330" fill="url(#glowBlue)"/>
  <ellipse cx="220" cy="980" rx="400" ry="300" fill="url(#glowYellow)"/>

  <!-- Garis diagonal sudut -->
  <g stroke="#062A78" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round">
    <line x1="40" y1="300" x2="320" y2="20"/>
    <line x1="40" y1="380" x2="400" y2="20"/>
    <line x1="1640" y1="1060" x2="1900" y2="800"/>
    <line x1="1560" y1="1060" x2="1900" y2="720"/>
  </g>

  <!-- Kartu dashboard outline + bar chart (kanan atas) -->
  <g>
    <rect x="1440" y="70" width="380" height="210" rx="18" fill="#FFFFFF" fill-opacity="0.55" stroke="#095BAF" stroke-opacity="0.35" stroke-width="2"/>
    <rect x="1474" y="196" width="30" height="54" rx="6" fill="#095BAF" fill-opacity="0.55"/>
    <rect x="1520" y="166" width="30" height="84" rx="6" fill="#EEDD55" fill-opacity="0.85"/>
    <rect x="1566" y="186" width="30" height="64" rx="6" fill="#34A853" fill-opacity="0.7"/>
    <rect x="1612" y="140" width="30" height="110" rx="6" fill="#062A78" fill-opacity="0.5"/>
    <rect x="1658" y="176" width="30" height="74" rx="6" fill="#EA4335" fill-opacity="0.55"/>
    <line x1="1474" y1="254" x2="1786" y2="254" stroke="#062A78" stroke-opacity="0.3" stroke-width="2"/>
    <!-- Empat titik warna BDC -->
    <rect x="1474" y="100" width="14" height="14" rx="3" fill="#095BAF"/>
    <rect x="1496" y="100" width="14" height="14" rx="3" fill="#EA4335"/>
    <rect x="1518" y="100" width="14" height="14" rx="3" fill="#EEDD55"/>
    <rect x="1540" y="100" width="14" height="14" rx="3" fill="#34A853"/>
    <!-- Mini line chart -->
    <polyline points="1600,120 1640,104 1680,112 1720,90 1760,98" fill="none" stroke="#095BAF" stroke-opacity="0.6" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- Lingkaran konsentris (kanan tengah) -->
  <g fill="none">
    <circle cx="1880" cy="560" r="200" stroke="#095BAF" stroke-opacity="0.28" stroke-width="2"/>
    <circle cx="1880" cy="560" r="140" stroke="#062A78" stroke-opacity="0.2" stroke-width="2" stroke-dasharray="10 12"/>
    <circle cx="1880" cy="560" r="70" stroke="#095BAF" stroke-opacity="0.25" stroke-width="2"/>
    <circle cx="1880" cy="560" r="10" fill="#EEDD55" fill-opacity="0.9"/>
  </g>

  <!-- Line chart (kanan bawah) -->
  <g>
    <rect x="1380" y="820" width="460" height="220" rx="18" fill="#FFFFFF" fill-opacity="0.45" stroke="#34A853" stroke-opacity="0.35" stroke-width="2"/>
    <polyline points="1420,990 1500,940 1570,962 1650,896 1720,920 1800,860" fill="none" stroke="#34A853" stroke-opacity="0.75" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <g fill="#FFFFFF" stroke="#34A853" stroke-width="3">
      <circle cx="1500" cy="940" r="6"/>
      <circle cx="1650" cy="896" r="6"/>
      <circle cx="1800" cy="860" r="6"/>
    </g>
    <g stroke="#062A78" stroke-opacity="0.25" stroke-width="2">
      <line x1="1420" y1="1010" x2="1800" y2="1010"/>
      <line x1="1420" y1="860" x2="1420" y2="1010"/>
    </g>
  </g>

  <!-- Bar chart kecil (kiri bawah) -->
  <g>
    <line x1="70" y1="1040" x2="330" y2="1040" stroke="#062A78" stroke-opacity="0.28" stroke-width="2"/>
    <rect x="90" y="970" width="34" height="70" rx="6" fill="#095BAF" fill-opacity="0.5"/>
    <rect x="140" y="940" width="34" height="100" rx="6" fill="#EEDD55" fill-opacity="0.8"/>
    <rect x="190" y="985" width="34" height="55" rx="6" fill="#34A853" fill-opacity="0.6"/>
    <rect x="240" y="920" width="34" height="120" rx="6" fill="#EA4335" fill-opacity="0.5"/>
    <rect x="290" y="955" width="34" height="85" rx="6" fill="#062A78" fill-opacity="0.4"/>
  </g>

  <!-- Lingkaran samar (kiri) -->
  <g fill="none" stroke="#095BAF">
    <circle cx="30" cy="560" r="160" stroke-opacity="0.14" stroke-width="2"/>
    <circle cx="30" cy="560" r="110" stroke-opacity="0.1" stroke-width="2" stroke-dasharray="8 10"/>
  </g>

  <!-- Aksen titik/kotak tersebar -->
  <g>
    <circle cx="420" cy="70" r="7" fill="#EEDD55" fill-opacity="0.9"/>
    <rect x="900" y="46" width="13" height="13" rx="3" fill="#EA4335" fill-opacity="0.6" transform="rotate(45 906 52)"/>
    <circle cx="1180" cy="120" r="6" fill="#34A853" fill-opacity="0.7"/>
    <circle cx="760" cy="1030" r="8" fill="#095BAF" fill-opacity="0.55"/>
    <rect x="1040" y="1000" width="14" height="14" rx="3" fill="#EEDD55" fill-opacity="0.85"/>
    <circle cx="1860" cy="380" r="7" fill="#EA4335" fill-opacity="0.65"/>
    <rect x="60" y="640" width="12" height="12" rx="3" fill="#34A853" fill-opacity="0.6"/>
    <circle cx="1320" cy="1050" r="6" fill="#095BAF" fill-opacity="0.5"/>
  </g>
</svg>
