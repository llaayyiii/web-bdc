<svg xmlns="http://www.w3.org/2000/svg" width="110" height="95" fill="none" shape-rendering="crispEdges" viewBox="0 0 110 95">
  <!-- Road & Foundation -->
  <rect x="6" y="88" width="98" height="5" fill="#334155" />
  <rect x="12" y="82" width="86" height="6" fill="#64748b" />
  
  <!-- Dutch Colonial Heritage Building (Gedung BNI/Pos Titik Nol) -->
  <rect x="18" y="36" width="74" height="46" fill="#FAF9F2" stroke="#CBD5E1" stroke-width="2" />
  
  <!-- Center Tower Clock -->
  <rect x="42" y="16" width="26" height="20" fill="#FAF9F2" stroke="#CBD5E1" stroke-width="2" />
  <!-- Dome Roof -->
  <rect x="44" y="8" width="22" height="8" fill="#095BAF" />
  <rect x="48" y="4" width="14" height="4" fill="#062A78" />
  <rect x="54" y="1" width="2" height="3" fill="#E9AD17" />
  <!-- Clock Face -->
  <circle cx="55" cy="26" r="5" fill="#FFFFFF" stroke="#000741" stroke-width="1" />
  <rect x="54.5" y="23" width="1" height="3" fill="#000741" />
  <rect x="54.5" y="25.5" width="2.5" height="1" fill="#000741" />
  
  <!-- Colonial Arches & Windows -->
  <rect x="24" y="44" width="12" height="16" fill="#BAE6FD" stroke="#095BAF" stroke-width="1.5" rx="4" />
  <rect x="74" y="44" width="12" height="16" fill="#BAE6FD" stroke="#095BAF" stroke-width="1.5" rx="4" />
  <rect x="48" y="58" width="14" height="24" fill="#095BAF" />
  <rect x="50" y="60" width="10" height="20" fill="#FAF9F2" />
</svg>