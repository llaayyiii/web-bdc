<svg xmlns="http://www.w3.org/2000/svg" width="130" height="90" fill="none" shape-rendering="crispEdges" viewBox="0 0 130 90">
  <!-- Ground foundation -->
  <rect x="10" y="82" width="110" height="6" fill="#334155" />
  <rect x="14" y="78" width="102" height="4" fill="#64748b" />
  
  <!-- Building Base (White & Light Gray) -->
  <rect x="18" y="34" width="94" height="44" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="2" />
  
  <!-- Campus Main Blue Facade Portal -->
  <rect x="44" y="24" width="42" height="54" fill="#095BAF" />
  <rect x="48" y="28" width="34" height="50" fill="#062A78" />
  
  <!-- Signboard UTDI -->
  <rect x="46" y="14" width="38" height="10" fill="#FAF9F2" stroke="#000741" stroke-width="1.5" />
  <!-- Letters U T D I (in gold/orange) -->
  <rect x="50" y="17" width="6" height="5" fill="#E9AD17" />
  <rect x="58" y="17" width="6" height="2" fill="#E9AD17" />
  <rect x="60" y="19" width="2" height="3" fill="#E9AD17" />
  <rect x="66" y="17" width="6" height="5" fill="#E9AD17" />
  <rect x="74" y="17" width="4" height="5" fill="#E9AD17" />
  
  <!-- Side Wings Windows (Left Wing) -->
  <rect x="22" y="40" width="18" height="12" fill="#095BAF" />
  <rect x="24" y="42" width="6" height="8" fill="#93C5FD" />
  <rect x="32" y="42" width="6" height="8" fill="#93C5FD" />
  <rect x="22" y="58" width="18" height="12" fill="#095BAF" />
  <rect x="24" y="60" width="6" height="8" fill="#93C5FD" />
  <rect x="32" y="60" width="6" height="8" fill="#93C5FD" />
  
  <!-- Side Wings Windows (Right Wing) -->
  <rect x="90" y="40" width="18" height="12" fill="#095BAF" />
  <rect x="92" y="42" width="6" height="8" fill="#93C5FD" />
  <rect x="100" y="42" width="6" height="8" fill="#93C5FD" />
  <rect x="90" y="58" width="18" height="12" fill="#095BAF" />
  <rect x="92" y="60" width="6" height="8" fill="#93C5FD" />
  <rect x="100" y="60" width="6" height="8" fill="#93C5FD" />
  
  <!-- Glass Entrance Door -->
  <rect x="54" y="60" width="22" height="18" fill="#BAE6FD" stroke="#FFFFFF" stroke-width="1.5" />
  <rect x="64" y="60" width="2" height="18" fill="#095BAF" />
  <!-- Entrance Canopy -->
  <rect x="50" y="56" width="30" height="4" fill="#E9AD17" />
